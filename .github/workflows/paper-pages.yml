name: paper-pages

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'scanner_v1/**'
      - '.github/workflows/paper-pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-pages
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ict-mmxm-turtle-scanner-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner_v1/requirements.txt
      - name: Install
        working-directory: scanner_v1
        run: pip install -r requirements.txt
      - name: Restore persistent paper DB
        run: |
          mkdir -p scanner_v1/data
          if [ -f paper_state/setups.db ]; then cp paper_state/setups.db scanner_v1/data/setups.db; fi
      - name: Scan top 50 and update paper account
        working-directory: scanner_v1
        env:
          TOP_N: '50'
          MIN_SCORE: '75'
          STATE_DB: data/setups.db
          PAPER_START_BALANCE: '1000'
          PAPER_RISK_PCT: '0.01'
          CHARTS_ENABLED: 'false'
          ALERT_ON_CHANGE_ONLY: 'true'
        run: python main.py
      - name: Export Pages data
        working-directory: scanner_v1
        env:
          STATE_DB: data/setups.db
          PAGES_DIR: site
        run: python pages_export.py
      - name: Persist paper state
        run: |
          mkdir -p paper_state
          cp scanner_v1/data/setups.db paper_state/setups.db
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add paper_state/setups.db scanner_v1/site/data.json
          git diff --cached --quiet || git commit -m 'update paper trading state'
          git push origin HEAD:agent/ict-mmxm-turtle-scanner-v1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: scanner_v1/site
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
